name: Daily RSS Scraper

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create/update releases
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper
        run: npm run scrape

      - name: Determine Year and File
        id: date_info
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          YEAR=$(date -u +"%Y")
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT

      - name: Publish to Yearly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rss-data-${{ steps.date_info.outputs.year }}
          name: RSS Data Archive ${{ steps.date_info.outputs.year }}
          files: scripts/output/${{ steps.date_info.outputs.today }}.json
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
