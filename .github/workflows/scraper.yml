name: Daily RSS Scraper

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create/update releases
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Determine Year and File
        id: date_info
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          YEAR=$(date -u +"%Y")
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT

      - name: Run Scraper
        run: npm run scrape

      - name: Publish to Data Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data
          git checkout data
          mkdir -p rss-data-${{ steps.date_info.outputs.year }}
          cp scripts/output/${{ steps.date_info.outputs.today }}.tsv.gz rss-data-${{ steps.date_info.outputs.year }}/
          git add rss-data-${{ steps.date_info.outputs.year }}/${{ steps.date_info.outputs.today }}.tsv.gz
          git commit -m "chore: add daily news for ${{ steps.date_info.outputs.today }}" || echo "No changes to commit"
          git push origin data
